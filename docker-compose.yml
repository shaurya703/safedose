services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: safedose
      POSTGRES_PASSWORD: safedose
      POSTGRES_DB: safedose
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safedose"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://safedose:safedose@db:5432/safedose
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8100:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3100:80"

volumes:
  pgdata:
